<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Students – SRMS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body style="visibility: hidden">
    <main id="content" data-title="Students" data-sub="Student records">
      <div class="panel flex-1">
        <div class="flex flex-wrap gap-2 mb-4">
          <input
            id="q"
            class="inp sm"
            placeholder="Search name or student no."
            aria-label="Search"
          />
          <select id="program" class="inp sm" aria-label="Program">
            <option value="">All programs</option>
          </select>
          <select id="year" class="inp sm" aria-label="Year level">
            <option value="">All years</option>
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
          </select>
          <select id="standing" class="inp sm" aria-label="Standing">
            <option value="">All standings</option>
            <option>Regular</option>
            <option>Irregular</option>
          </select>
          <select id="status" class="inp sm" aria-label="Status">
            <option value="">All statuses</option>
            <option>Active</option>
            <option>Transferred</option>
            <option>Dropped</option>
          </select>
          <button id="add" class="btn hidden ml-auto">Add student</button>
        </div>
        <p id="count" class="text-sm text-mut mb-2">&nbsp;</p>
        <div class="tblwrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>Student no.</th>
                <th>Name</th>
                <th>Program</th>
                <th>Year</th>
                <th>Standing</th>
                <th>Status</th>
                <th>Email</th>
                <th id="act" class="hidden">Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>
    <dialog id="dlg"></dialog>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/students.js"></script>
  </body>
</html>
