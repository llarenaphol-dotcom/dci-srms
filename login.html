<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in – SRMS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body class="min-h-screen flex flex-col">
    <header class="topbar">
      <div class="flex items-center gap-3 px-6 md:px-14 h-20">
        <img
          src="assets/img/icon.svg"
          alt="SRMS logo"
          class="w-16 h-12 rounded-lg bg-white object-cover shadow-sm"
        />
        <span class="min-w-0 text-xs sm:text-sm leading-tight"
          >Student Record Management System</span
        >
      </div>
    </header>

    <main class="flex-1 grid place-items-center p-6">
      <div
        class="w-full max-w-[480px] bg-card border border-line rounded-xl p-8 md:p-10 shadow-sm"
      >
        
        <h1 class="text-[32px] font-bold leading-tight mt-3">Sign in</h1>
        <p class="text-mut mt-3">
          Sign in to access your organization’s records.
        </p>

        <form id="lf" class="mt-8" novalidate>
          <div>
            <label for="u">Username</label>
            <input
              id="u"
              class="inp w-full"
              placeholder="e.g. m.santos"
              autocomplete="username"
              autocapitalize="none"
              required
            />
          </div>
          <div class="mt-5">
            <label for="p">Password</label>
            <div class="relative">
              <input
                id="p"
                type="password"
                class="inp eye w-full"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                id="show"
                aria-label="Show password"
                aria-pressed="false"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-mut hover:text-ink"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <div class="flex justify-end mt-4">
            <button
              type="button"
              id="fp"
              class="text-sm font-semibold text-pri hover:underline"
            >
              Forgot password?
            </button>
          </div>
          <p id="fh" class="hidden text-sm text-mut mt-2">
            Ask your administrator to reset your password.
          </p>
          <p id="e" role="alert" class="min-h-[20px] mt-3 text-sm text-bad"></p>
          <button
            id="go"
            class="btn lg w-full mt-2 flex items-center justify-center gap-2"
            type="submit"
          >
            <span id="gol">Sign in</span>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
      </div>
    </main>

    <footer class="footbar">
      <div
        class="flex flex-wrap items-center justify-center md:justify-between gap-x-6 gap-y-2 px-6 md:px-14 py-6 text-xs"
      >
        <span>© 2026 SRMS. All rights reserved.</span>
        <span>For authorized personnel only.</span>
      </div>
    </footer>

    <script src="assets/js/login.js"></script>
  </body>
</html>
